name: Web build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2   # match your Godot version
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.7.2.stable \
             ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Export Web build
        run: |
          mkdir -v -p $GITHUB_WORKSPACE/build/web
          godot --headless --verbose --path "$GITHUB_WORKSPACE/ddfiles" \
            --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # Also keep the zip around for manual itch.io upload
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  itch:
    needs: export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push build/web https://mysteriousjuice.itch.io/ifsrjam2:html5